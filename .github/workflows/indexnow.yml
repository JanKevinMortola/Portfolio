name: Submit portfolio pages to IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Submit portfolio URLs
        shell: bash
        env:
          INDEXNOW_KEY: 44115384ecc6357535bce2145d35289a
          KEY_LOCATION: https://jankevinmortola.github.io/Portfolio/44115384ecc6357535bce2145d35289a.txt
          SITE_ROOT: https://jankevinmortola.github.io/Portfolio
        run: |
          set -euo pipefail

          submit_url() {
            local url="$1"
            [ -z "$url" ] && return 0
            echo "Submitting: $url"
            curl --fail-with-body --silent --show-error --get \
              'https://api.indexnow.org/indexnow' \
              --data-urlencode "url=$url" \
              --data-urlencode "key=$INDEXNOW_KEY" \
              --data-urlencode "keyLocation=$KEY_LOCATION"
            echo
          }

          changed=""
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD^ HEAD -- '*.html' || true)
          fi

          if [ -n "$changed" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [ "$file" = "index.html" ]; then
                submit_url "$SITE_ROOT/"
              else
                submit_url "$SITE_ROOT/$file"
              fi
            done <<< "$changed"
          else
            echo "No HTML change detected; submitting all canonical URLs from sitemap.xml."
            grep -oE '<loc>[^<]+' sitemap.xml | sed 's#<loc>##' | while IFS= read -r url; do
              submit_url "$url"
            done
          fi
